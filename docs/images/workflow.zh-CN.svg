<rect x="48" y="1510" width="1264" height="56" rx="10" fill="#edf2f7" stroke="#d4dee7"/>
<text x="68" y="1545" class="body">人确认完成 → 保存已确认稿件与检查记录；投稿是另行授权的动作。</text>
<path class="route" d="M1312 1450H1332V1490H82V1504"/>
<text x="48" y="1610" class="small">修改当前交付 → 回当前轮；改变目标、主线或上游输入 → 重开受影响任务。</text>
<text x="48" y="1654" class="small">可选 skill 只协助当前内容任务，成果回到同一人审入口；skill 的 PASS 不代替人的同意。</text>
<text x="48" y="1698" class="small">程序管理流程与版本，不判断研究价值，也不认证学术正确性或人类身份。</text>
