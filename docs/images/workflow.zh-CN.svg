<text x="48" y="64" class="title">PaperShaper · 人与 AI 如何协同</text>
<text x="48" y="102" class="sub">每轮都有具体交付与人的决定。AI 完成当前工作，经人复核同意后才推进。</text>
<rect x="48" y="130" width="1264" height="60" rx="10" fill="#edf2f7" stroke="#d4dee7"/>
<text x="68" y="167" class="body">人提供项目入口、目标偏好与硬约束；AI 先查已有材料，再询问仍缺的信息。</text>
<text x="48" y="224" class="col">AI｜获取、分析、建议、执行</text>
<text x="704" y="224" class="col">程序｜检查与记录</text>
<text x="945" y="224" class="col">人｜判断、选择、批准</text>
