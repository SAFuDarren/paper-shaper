<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1748" viewBox="0 0 1360 1748" role="img" aria-labelledby="title desc">
<title id="title">PaperShaper · 人与 AI 如何协同</title>
<desc id="desc">每轮都有具体交付与人的决定。AI 完成当前工作，经人复核同意后才推进。 默认 plan_only：各节规划通过后停止。正文需要明确到单元和方式的授权。 修改当前交付 → 回当前轮；改变目标、主线或上游输入 → 重开受影响任务。</desc>
