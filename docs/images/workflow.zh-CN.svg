<text x="68" y="1137" class="body">默认 plan_only：各节规划通过后停止。正文需要明确到单元和方式的授权。</text>
<text x="68" y="1168" class="small">R06／R07 可先规划全部章节，也可逐节规划后写作；节奏由人在 R05 选择。</text>
<path class="route" d="M1312 1044H1332V1080H82V1098"/>
