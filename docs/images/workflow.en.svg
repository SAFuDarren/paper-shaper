<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="350" viewBox="0 0 1160 350" role="img" aria-labelledby="title desc">
<title id="title">How PaperShaper works</title>
<desc id="desc">You own the direction and judgment. AI prepares and carries out the work. Need changes? Revise this work. Planning first. The controller keeps progress and decisions; specialist skills join when needed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616f"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1c2937}.title{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#536271}.node{font-size:19px;font-weight:700}.detail{font-size:15px;fill:#536271}.route{fill:none;stroke:#647683;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="1160" height="350" rx="14" fill="#fafbf9"/>
<text x="32" y="44" class="title">How PaperShaper works</text>
<text x="32" y="78" class="sub">You own the direction and judgment. AI prepares and carries out the work.</text>
<rect x="32" y="112" width="244" height="84" rx="10" fill="#fff4df" stroke="#dfbd82"/>
<text x="154" y="146" class="node" text-anchor="middle">You set direction</text>
<text x="154" y="175" class="detail" text-anchor="middle">Goal, value and scope</text>
<path class="route" d="M281 154H309"/>
<rect x="316" y="112" width="244" height="84" rx="10" fill="#eaf5f2" stroke="#b2d4cb"/>
<text x="438" y="146" class="node" text-anchor="middle">AI prepares and delivers</text>
<text x="438" y="175" class="detail" text-anchor="middle">Materials, options and results</text>
<path class="route" d="M565 154H593"/>
<rect x="600" y="112" width="244" height="84" rx="10" fill="#fff4df" stroke="#dfbd82"/>
<text x="722" y="146" class="node" text-anchor="middle">You review and choose</text>
<text x="722" y="175" class="detail" text-anchor="middle">Argument, structure and emphasis</text>
<path class="route" d="M849 154H877"/>
<rect x="884" y="112" width="244" height="84" rx="10" fill="#eaf5f2" stroke="#b2d4cb"/>
<text x="1006" y="146" class="node" text-anchor="middle">Advance after approval</text>
<text x="1006" y="175" class="detail" text-anchor="middle">Next step or next unit</text>
<path class="route" d="M722 196V230H438V202"/>
<text x="580" y="256" class="detail" text-anchor="middle">Need changes? Revise this work.</text>
<path d="M32 280H1128" stroke="#dce3e7"/>
<text x="32" y="307" class="sub">Goal → Evidence → Argument and structure → Section plans → Authorized writing and review</text>
<text x="32" y="334" class="detail">Planning first. The controller keeps progress and decisions; specialist skills join when needed.</text>
</svg>
